name: H-1B job monitor

on:
  workflow_dispatch:
    inputs:
      force_crawl:
        description: "Force a crawl even if this window is covered (normally leave false)"
        type: boolean
        default: false
  schedule:
    # A wake-up is NOT a crawl. Delayed events check the Pacific window due
    # when they actually arrive, using persisted real-crawl history.
    - cron: "17,47 * * * *"

permissions: {}

concurrency:
  group: h1b-job-monitor
  cancel-in-progress: false

jobs:
  crawl:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore persistent discovery state
        id: state-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/jobs.sqlite
          key: h1b-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            h1b-state-v2-

      - name: Validate or recover durable state without resetting seen jobs
        id: state-recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cloud_state.py recover

      - name: Check whether a real crawl is due now
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          FORCE_CRAWL: ${{ inputs.force_crawl && 'true' || 'false' }}
        run: |
          python scripts/schedule_guard.py \
            --event-name "$EVENT_NAME" \
            --schedule "$SCHEDULE_EXPRESSION" \
            --force "$FORCE_CRAWL" \
            --output "$GITHUB_OUTPUT"

      - name: Validate configuration and tests
        id: validate
        if: ${{ steps.cadence.outputs.should_run == 'true' }}
        run: |
          PYTHONPATH=src python -m h1b_job_monitor validate-config
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Crawl official career sources
        id: crawl
        if: ${{ steps.cadence.outputs.should_run == 'true' }}
        continue-on-error: true
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 90m env PYTHONPATH=src \
            python -m h1b_job_monitor crawl --mode auto
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Checkpoint persistent state
        id: checkpoint
        if: ${{ always() && steps.cadence.outputs.should_run == 'true' && hashFiles('data/jobs.sqlite') != '' && hashFiles('reports/latest.json') != '' }}
        run: |
          python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("data/jobs.sqlite")
          try:
              result = connection.execute("PRAGMA quick_check").fetchone()[0]
              if result != "ok":
                  raise SystemExit(f"SQLite quick_check failed: {result}")
              checkpoint = connection.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone()
              if checkpoint and checkpoint[0] != 0:
                  raise SystemExit(f"SQLite WAL checkpoint remained busy: {checkpoint}")
          finally:
              connection.close()
          PY

      - name: Build workflow summary
        id: summary
        if: ${{ always() && steps.cadence.outputs.should_run == 'true' }}
        env:
          MONITOR_OUTCOME: ${{ steps.crawl.outcome }}
          MONITOR_EXIT_CODE: ${{ steps.crawl.outputs.exit_code }}
          STATE_RESTORE_OUTCOME: ${{ steps.state-restore.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.state-recover.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          CHECKPOINT_OUTCOME: ${{ steps.checkpoint.outcome }}
        run: |
          python scripts/github_summary.py \
            --report reports/latest.json \
            --health reports/company_health.csv \
            --log logs/monitor.log \
            --output reports/github-summary.md \
            --monitor-outcome "$MONITOR_OUTCOME" \
            --monitor-exit-code "$MONITOR_EXIT_CODE" \
            --step-outcome "State restore=$STATE_RESTORE_OUTCOME" \
            --step-outcome "Bootstrap=$BOOTSTRAP_OUTCOME" \
            --step-outcome "Validation=$VALIDATE_OUTCOME" \
            --step-outcome "SQLite checkpoint=$CHECKPOINT_OUTCOME"
          cat reports/github-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Notify through deduplicated GitHub issues
        id: notify
        if: ${{ always() && steps.cadence.outputs.should_run == 'true' && steps.summary.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_KIND: ${{ steps.summary.outputs.alert_kind }}
          ALERT_TITLE: ${{ steps.summary.outputs.alert_title }}
          MATCH_TITLE: ${{ steps.summary.outputs.match_title }}
          MONITOR_RUN_ID: ${{ steps.summary.outputs.monitor_run_id }}
          NEW_MATCHES: ${{ steps.summary.outputs.new_matches }}
        run: |
          gh label create h1b-monitor-failure \
            --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description "Current H-1B monitor or source failure" \
            --force
          OPEN_FAILURE="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label h1b-monitor-failure \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          if [ "$ALERT_KIND" = "failure" ]; then
            if [ -n "$OPEN_FAILURE" ]; then
              gh issue edit "$OPEN_FAILURE" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ALERT_TITLE" \
                --body-file reports/github-summary.md
              gh issue comment "$OPEN_FAILURE" \
                --repo "$GITHUB_REPOSITORY" \
                --body "Failure update from [workflow run $GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). The issue body now contains the latest exact source status."
            else
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --assignee "$GITHUB_REPOSITORY_OWNER" \
                --label h1b-monitor-failure \
                --title "$ALERT_TITLE" \
                --body-file reports/github-summary.md
            fi
          else
            if [ -n "$OPEN_FAILURE" ]; then
              gh issue comment "$OPEN_FAILURE" \
                --repo "$GITHUB_REPOSITORY" \
                --body "Recovered: all enabled sources checked successfully in [workflow run $GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). This failure alert is resolved; job-match issues remain open."
              gh issue close "$OPEN_FAILURE" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed
            fi
          fi

          if [ "$NEW_MATCHES" -gt 0 ]; then
            gh label create h1b-monitor-match \
              --repo "$GITHUB_REPOSITORY" \
              --color 1D76DB \
              --description "New verified H-1B-friendly role matches" \
              --force
            EXISTING_MATCH="$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --label h1b-monitor-match \
              --limit 100 \
              --json number,body | python -c \
              'import json, os, sys; marker = "h1b-monitor-run:" + os.environ.get("MONITOR_RUN_ID", ""); rows = json.load(sys.stdin); print(next((row["number"] for row in rows if marker and marker in (row.get("body") or "")), ""))')"
            if [ -z "$EXISTING_MATCH" ]; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --assignee "$GITHUB_REPOSITORY_OWNER" \
                --label h1b-monitor-match \
                --title "$MATCH_TITLE" \
                --body-file reports/github-summary.md
            fi
          fi

      - name: Prepare checked recovery backup
        id: backup-prepare
        if: ${{ always() && steps.cadence.outputs.should_run == 'true' && steps.checkpoint.outcome == 'success' && steps.summary.outcome == 'success' && steps.notify.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/cloud_state.py backup

      - name: Upload durable state recovery backup
        id: backup-upload
        if: ${{ always() && steps.backup-prepare.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h1b-state-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: state-backup/
          if-no-files-found: error
          retention-days: 90

      - name: Save persistent discovery state
        id: state-save
        if: ${{ always() && steps.cadence.outputs.should_run == 'true' && steps.checkpoint.outcome == 'success' && steps.summary.outcome == 'success' && steps.notify.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/jobs.sqlite
          key: h1b-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload reports and health log
        id: upload
        if: ${{ always() && steps.cadence.outputs.should_run == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h1b-job-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Notify if persistence or report upload failed
        id: infrastructure-notify
        if: ${{ always() && steps.cadence.outputs.should_run == 'true' && (steps.state-save.outcome == 'failure' || steps.upload.outcome == 'failure' || steps.backup-prepare.outcome == 'failure' || steps.backup-upload.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_SAVE_OUTCOME: ${{ steps.state-save.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          BACKUP_PREPARE: ${{ steps.backup-prepare.outcome }}
          BACKUP_UPLOAD: ${{ steps.backup-upload.outcome }}
        run: |
          {
            echo '# H-1B job monitor infrastructure failure'
            echo
            echo "- Persistent state save: \`$STATE_SAVE_OUTCOME\`"
            echo "- Report artifact upload: \`$UPLOAD_OUTCOME\`"
            echo "- Recovery backup preparation/upload: $BACKUP_PREPARE / $BACKUP_UPLOAD"
            echo
            echo "Inspect workflow run $GITHUB_RUN_ID for the exact step logs."
          } > reports/infrastructure-failure.md
          gh label create h1b-monitor-failure \
            --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description "Current H-1B monitor or source failure" \
            --force
          OPEN_FAILURE="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label h1b-monitor-failure \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$OPEN_FAILURE" ]; then
            gh issue edit "$OPEN_FAILURE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "H-1B monitor infrastructure failure" \
              --body-file reports/infrastructure-failure.md
            gh issue comment "$OPEN_FAILURE" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Infrastructure failure update from [workflow run $GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --assignee "$GITHUB_REPOSITORY_OWNER" \
              --label h1b-monitor-failure \
              --title "H-1B monitor infrastructure failure" \
              --body-file reports/infrastructure-failure.md
          fi

      - name: Update always-open monitor status
        id: status
        if: ${{ always() && steps.cadence.outcome != 'cancelled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.state-restore.outputs.cache-matched-key }}
          RESTORE: ${{ steps.state-restore.outcome }}
          RECOVER: ${{ steps.state-recover.outcome }}
          CADENCE: ${{ steps.cadence.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          CRAWL: ${{ steps.crawl.outcome }}
          CHECKPOINT: ${{ steps.checkpoint.outcome }}
          SUMMARY: ${{ steps.summary.outcome }}
          NOTIFY: ${{ steps.notify.outcome }}
          SAVE: ${{ steps.state-save.outcome }}
          BACKUP_PREPARE: ${{ steps.backup-prepare.outcome }}
          BACKUP_UPLOAD: ${{ steps.backup-upload.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          python scripts/github_status.py --cache-key "$CACHE_KEY" \
            --step-outcome "State restore=$RESTORE" --step-outcome "State recovery=$RECOVER" \
            --step-outcome "Cadence=$CADENCE" --step-outcome "Validation=$VALIDATE" \
            --step-outcome "Crawl=$CRAWL" --step-outcome "Checkpoint=$CHECKPOINT" \
            --step-outcome "Summary=$SUMMARY" --step-outcome "Notifications=$NOTIFY" \
            --step-outcome "State save=$SAVE" --step-outcome "Backup=$BACKUP_PREPARE" \
            --step-outcome "Backup upload=$BACKUP_UPLOAD" --step-outcome "Report upload=$UPLOAD"

      - name: Propagate any failure
        if: >-
          ${{ always() && (
            steps.state-restore.outcome == 'failure' ||
            steps.state-recover.outcome == 'failure' ||
            steps.cadence.outcome == 'failure' ||
            steps.validate.outcome == 'failure' ||
            steps.crawl.outcome == 'failure' ||
            steps.checkpoint.outcome == 'failure' ||
            steps.summary.outcome == 'failure' ||
            steps.notify.outcome == 'failure' ||
            steps.state-save.outcome == 'failure' ||
            steps.upload.outcome == 'failure' ||
            steps.backup-prepare.outcome == 'failure' ||
            steps.backup-upload.outcome == 'failure' ||
            steps.status.outcome == 'failure' ||
            steps.infrastructure-notify.outcome == 'failure'
          ) }}
        run: exit 1
